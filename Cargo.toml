[workspace]
members = ["crates/intercat-git", "crates/intercat-daemon"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "revision", "merge", "status"] }
libc = "0.2.191"
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "functions"] }
sha2 = "=0.11.1"
uuid = { version = "=1.29.0", features = ["v5", "v7", "serde"] }
base64 = "=0.23.1"
